name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q GRFps.zip

      - name: Build debug APK
        working-directory: GRFps
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            GRFps/app/build/outputs/apk/debug/app-debug.apk \
            --title "GR FPS build ${{ github.run_number }}" \
            --notes "Debug APK"
            
